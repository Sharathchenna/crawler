<script>
(function(){
  var DUR = 5.227;
  var root = document.querySelector('[data-composition-id="04-agent-loop"]');
  function $(id){ return root.querySelector('#' + CSS.escape(id)); }
  var tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["04-agent-loop"] = tl;

  // Kicker + terminal surface land first (hero visible well before t=0.5).
  tl.fromTo($('04-agent-loop-kicker'), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power1.out' }, 0);
  tl.fromTo($('04-agent-loop-term'), { scale: 0.92, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: 'power3.out' }, 0);

  // Scene 1 (0.0-1.4): discrete type-on of the install command with a
  // context-sensitive block cursor (ink -> amber -> teal -> success green).
  var C_MAIN = '#000000', C_BRAND = '#E8A55A', C_CMD = '#1F7A5C', C_DONE = '#5DB872';
  var SEQ = [
    { t: 0.00, text: '',                                segment: 'main',  color: C_MAIN },
    { t: 0.20, text: 'npx ',                            segment: 'main',  color: C_MAIN },
    { t: 0.45, text: 'npx hyperframes ',                segment: 'brand', color: C_BRAND },
    { t: 0.70, text: 'npx hyperframes skills',          segment: 'cmd',   color: C_CMD },
    { t: 0.95, text: 'npx hyperframes skills update',   segment: 'cmd',   color: C_CMD },
    { t: 1.15, text: 'npx hyperframes skills update ✓', segment: 'done',  color: C_DONE }
  ];
  function entryAt(time){
    for (var i = SEQ.length - 1; i >= 0; i--){ if (time >= SEQ[i].t) return SEQ[i]; }
    return SEQ[0];
  }
  // Baked change times (seek-safe): every entry whose text differs is a keystroke.
  var CHANGE_TIMES = SEQ.filter(function(e, i){ return i > 0 && e.text !== SEQ[i - 1].text; }).map(function(e){ return e.t; });
  var TYPING_GRACE = 0.15;
  var textEl = $('04-agent-loop-text');
  var cursorEl = $('04-agent-loop-cursor');
  var driver = { t: 0 };
  tl.to(driver, {
    t: 1.3, duration: 1.3, ease: 'none',
    onUpdate: function(){
      var entry = entryAt(driver.t);
      if (textEl.textContent !== entry.text) textEl.textContent = entry.text;
      cursorEl.style.background = entry.color;
    }
  }, 0);

  // Deterministic square-wave blink over the full shot (7 whole cycles).
  var blink = { p: 0 };
  tl.to(blink, {
    p: Math.PI * 2 * 7, duration: DUR, ease: 'none',
    onUpdate: function(){
      var isTyping = false;
      for (var i = 0; i < CHANGE_TIMES.length; i++){
        if (CHANGE_TIMES[i] <= driver.t && driver.t - CHANGE_TIMES[i] < TYPING_GRACE){ isTyping = true; break; }
      }
      cursorEl.style.opacity = (isTyping || Math.sin(blink.p) > 0) ? '1' : '0';
    }
  }, 0);

  // Scene 2 (1.4-3.8): checklist rows land one per spoken cue; each check pops.
  var rows = root.querySelectorAll('[data-f04-row]');
  var checks = root.querySelectorAll('[data-f04-check]');
  var CUES = [1.4, 2.2, 3.0];
  tl.fromTo($('04-agent-loop-checks'), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 1.35);
  for (var r = 0; r < rows.length; r++){
    tl.fromTo(rows[r], { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: 'power3.out' }, CUES[r]);
    tl.fromTo(checks[r], { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'power3.out' }, CUES[r] + 0.15);
  }

  // Scene 3 (3.8-5.227): receipt pops with coral edge, smooth settle, holds still.
  tl.fromTo($('04-agent-loop-receipt'), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: 'power3.out' }, 3.8);
