services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hoard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: hoard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoard"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://hoard:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}@db:5432/hoard
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  # Discovery cron loop (same 5-minute cadence as the Cloudflare worker).
  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://hoard:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}@db:5432/hoard
    command: ["node", "scheduler/scheduler.cjs"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata: {}
