# Hoard reverse proxy. Terminates TLS with a Cloudflare Origin CA certificate
# (dashboard: SSL/TLS -> Origin Server -> Create Certificate). DNS for your
# hostname MUST be proxied (orange cloud) with SSL mode Full (strict) —
# origin certificates are trusted only by Cloudflare's edge, never by browsers.
upstream hoard {
  server app:3000;
}

server {
  listen 80 default_server;
  server_name _;
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  server_name _;

  ssl_certificate /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=63072000" always;

  # Captures post pages/PDFs; keep in sync with MAX_CONVERT_BYTES server-side.
  client_max_body_size 32m;
  proxy_read_timeout 120s;
  proxy_connect_timeout 10s;

  location / {
    proxy_pass http://hoard;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
